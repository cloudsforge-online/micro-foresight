name: CI

# Almost the whole file. Every service in the estate calls the ONE reusable workflow in micro-org
# rather than carrying its own copy — the measured target in docs/ecosystem/03 §5 is zero bespoke CI
# files. If this repository ever needs a job of its own, that is usually the signal the reusable
# workflow needs an input, not that this repository needs a fork of it.
#
# `contracts` below IS the exception, and it is the same exception `micro-mint` carries: it is
# specific to a repository that commits compiled bytecode, and it stays. It has no equivalent in any
# other service, so an input for it would be an input nobody else could ever set.
#
# `service-ci.yml` typechecks, runs the suite against a real Postgres `ci_test` container, and FAILS
# the build if the database-backed suite skipped — which is why `src/testsupport.ts` reads
# `FORESIGHT_TEST_DATABASE_URL` spelled exactly as the workflow exports it. It also enforces the
# estate rules (one database, no cross-service imports, the three health endpoints, no unleased
# timers) that repository walls used to enforce for free.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    uses: cloudsforge-online/micro-org/.github/workflows/service-ci.yml@main
    with:
      service: foresight
      database-env-var: FORESIGHT_DATABASE_URL
      port: 4021
      # The image startup smoke test boots the real service, and `env.ts` validates its
      # configuration at import — so the container needs the variables it declares, not just a
      # database, or it exits before it serves /livez. URLs that are never dialled because /livez
      # needs no upstream, two all-zero addresses that only have to be twenty bytes of hex, and one
      # GENERATED secret. Never a real credential, and never a real treasury.
      #
      # ── `=@generate`, AND WHY THE LITERALS THAT WERE HERE HAD TO GO ──────────────────────────
      #
      # This block used to say the tokens "only have to clear a length check". That sentence is the
      # defect written into configuration: a length check is precisely what micro-org #142's
      # 40-character placeholder cleared on 44 containers across both networks. `env.ts` now runs
      # `@cloudsforge/secrets`, which asserts the SHAPE of a generated value and has no CI
      # exemption on purpose — `ci-only-not-a-real-secret-…` normalises to a string containing both
      # `cionly` and `notareal` and is refused twice over.
      #
      # CI does not need a WEAK secret, it needs A secret: nothing in the smoke test verifies a
      # signature against anything else. `=@generate` asks the shared workflow for a fresh
      # `openssl rand -base64 48` per run, which it throws away (micro-org `service-ci.yml`).
      smoke-env: |
        IDENTITY_JWKS_URL=http://127.0.0.1:4001/.well-known/jwks.json
        IDENTITY_ISSUER=http://127.0.0.1:4001
        OUTBOX_SIGNING_SECRET=@generate
        CUSTODY_URL=http://127.0.0.1:4005
        INDEXER_URL=http://127.0.0.1:4008
        LEDGER_URL=http://127.0.0.1:4007
        POLICY_URL=http://127.0.0.1:4006
        # `FORESIGHT_SERVICE_TOKEN` IS GONE FROM THIS BLOCK AND MUST NOT COME BACK.
        #
        # It was `ci-only-not-a-real-token-0000000000`, and `env.ts` now holds this variable to
        # `assertServiceCredential` — which refuses that string on the marker check and refuses a
        # JWT BY NAME. A JWT is what the live estate actually has in it (measured 2026-08-05: 805
        # bytes, expired 26 hours, container healthy — micro-org #222), so a smoke test that fed
        # this variable anything token-shaped would be smoke-testing the defect.
        #
        # `FORESIGHT_IDENTITY_CREDENTIAL` is deliberately absent too, for the reason `env.ts` gives
        # for making it optional: the image must BOOT without one, and there is no `@generate` for
        # a `cfsc_` credential because identity mints those against a row. Absence is the supported
        # mode — `null`, `mode: none`, and `/livez` makes no outbound call.
        FORESIGHT_TREASURY_ADDRESS=0x0000000000000000000000000000000000000001
        FORESIGHT_ORACLE_ADDRESS=0x0000000000000000000000000000000000000002
        FORESIGHT_ORACLE_USER_ID=ci
        FORESIGHT_ORACLE_ORDER_ID=ci-oracle
    secrets:
      # @cloudsforge/* is resolved by link:../runtime and link:../contracts, so CI checks out
      # micro-runtime and micro-contracts as siblings — both private, so the workflow needs a
      # contents:read token.
      estate_token: ${{ secrets.ESTATE_READ_TOKEN }}
    permissions:
      contents: read
      packages: read

  hygiene:
    uses: cloudsforge-online/micro-org/.github/workflows/secret-hygiene.yml@main
    permissions:
      contents: read

  contracts:
    name: Committed bytecode reproduces from the source
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.9.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      # The siblings are NOT needed here: `scripts/compile-contracts.mjs` uses only `solc` and the
      # Node standard library, and this job never imports a @cloudsforge package. A frozen install
      # of this repository's own lockfile is exactly enough, and it is what pins solc.
      - run: pnpm install --frozen-lockfile

      # This works because `solc` is EXACT-pinned and the install is frozen. Loosen that pin to a
      # caret range and the job stops proving anything: the recompile would produce different bytes
      # on a different day and the diff would be noise rather than signal.
      #
      # What it proves is the thing a reviewer cannot check by reading: that the bytecode this
      # service will deploy to Hearth — holding other people's EMBER — is the bytecode compiled from
      # the Solidity in this repository. A hand edit to `generated.ts` and a `.sol` change without a
      # recompile are the same red build.
      - name: Recompile and diff
        run: |
          pnpm compile:contracts
          if ! git diff --exit-code -- src/contracts/generated.ts; then
            echo '::error::src/contracts/generated.ts does not match src/contracts/ForesightMarket.sol — run `pnpm compile:contracts` and commit the result'
            exit 1
          fi
          echo 'ok: the committed bytecode reproduces from the source'

  # ──────────────────────────────────────────────────────────────────────────────────────────────
  # THE IMAGE, PUBLISHED. `cfctl release` writes a manifest naming ghcr.io/cloudsforge-online/<repo>
  # at this repository's package.json version (micro-org tools/cfctl.ts:889-934, image name derived
  # at tools/registry.ts:367-369); `cfctl release --verify` runs `docker manifest inspect` on every
  # entry (cfctl.ts:937-975); and deploy/scripts/release-deploy.sh:99-125 refuses to change anything
  # until all of them pull. Until this job existed CI built this image and threw it away, so that
  # gate rejected every service in the estate and the manifest path could not be used at all.
  #
  # `packages: write` IS GRANTED HERE rather than asked for inside the shared CI workflow, and that
  # is forced rather than stylistic: a called workflow's GITHUB_TOKEN can only be maintained or
  # reduced, never elevated, so a reusable workflow asking for a permission its caller withheld
  # fails the whole run at STARTUP — before a step runs, on pull requests as well as on main.
  # Measured on micro-org: run 30900277471 (caller capped at `packages: read`) ended in
  # startup_failure; run 30900280323 (same workflow, caller granted `packages: write`) succeeded.
  # That is also why `push: false` is correct and stays in the shared workflow's image job — that
  # job is a GATE and needs `load:` so it can boot the image and read its health endpoint. This is
  # the producer. Different purposes, so different jobs.
  # ──────────────────────────────────────────────────────────────────────────────────────────────
  publish:
    needs: [ci, hygiene, contracts]
    # A green push to main and nothing else. An image tag a release manifest pins has to name
    # something that passed, on the branch it will be deployed from.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: cloudsforge-online/micro-org/.github/workflows/publish-image.yml@main
    with:
      kind: service
    secrets:
      # The same sibling checkouts the Dockerfile's named build contexts need: the image cannot be
      # built without micro-runtime and micro-contracts beside it.
      estate_token: ${{ secrets.ESTATE_READ_TOKEN }}
    permissions:
      contents: read
      packages: write
